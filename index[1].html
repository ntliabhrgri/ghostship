<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Teleporting Target Game</title>
  <!-- Load p5.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }
    canvas {
      border: 2px solid #333;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>

<script>
let target;
let targetType = 'ghost'; // Initial target icon
let score = 0;
let duration = 180; // 3 minutes timer (180 seconds)
let startTime;
let state = 'start';
let spawnEvery = 60; // Initial teleport speed (~1 second)
let minSpawnEvery = 10; // Maximum speed limit (~0.16 seconds)

// List of Minecraft themed icons
const targetIcons = ['ghost', 'pumpkin', 'witch', 'monster', 'zombie'];

// Background details & particles
let stars = [];
let clouds = [];
let particles = [];

// Synthesized Web Audio API sound generator
let audioCtx;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playClickSound() {
  if (!audioCtx) return;
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }

  // Generate 8-bit retro click sound
  let osc = audioCtx.createOscillator();
  let gain = audioCtx.createGain();

  osc.type = 'square';
  osc.frequency.setValueAtTime(400, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);

  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.1);
}

function setup() {
  createCanvas(480, 360);
  spawnTarget();

  // Generate background stars
  for (let i = 0; i < 50; i++) {
    stars.push({
      x: random(width),
      y: random(height),
      size: random(1, 3)
    });
  }

  // Generate Minecraft-style clouds
  for (let i = 0; i < 4; i++) {
    clouds.push({
      x: random(width),
      y: random(20, 100),
      speed: random(0.2, 0.5)
    });
  }
}

function spawnTarget() {
  target = { 
    x: random(40, width - 40), 
    y: random(40, height - 40) 
  };
}

// Switch target icon randomly to a new type
function changeTargetIcon() {
  let availableTypes = targetIcons.filter(t => t !== targetType);
  targetType = random(availableTypes);
}

// Trigger particle explosion effect
function createTeleportParticles(x, y) {
  for (let i = 0; i < 25; i++) {
    let angle = random(TWO_PI);
    let speed = random(2, 6);
    particles.push({
      x: x,
      y: y,
      vx: cos(angle) * speed,
      vy: sin(angle) * speed,
      size: random(4, 8),
      alpha: 255,
      color: [random(180, 255), random(220, 255), 255]
    });
  }
}

function draw() {
  background(0);

  // Draw background stars
  fill(255);
  noStroke();
  for (let star of stars) {
    ellipse(star.x, star.y, star.size, star.size);
  }

  // Draw Minecraft clouds
  drawMinecraftClouds();

  // 1. START SCREEN
  if (state === 'start') {
    textAlign(CENTER, CENTER);
    fill(255);
    textSize(28);
    text('MINECRAFT TELEPORT', width / 2, height / 2 - 30);
    
    textSize(20);
    fill(200, 200, 255);
    text('Click Anywhere to Play', width / 2, height / 2 + 20);
    return;
  }

  // 2. GAME OVER SCREEN
  if (state === 'over') {
    textAlign(CENTER, CENTER);
    fill(255);
    textSize(24);
    text('Game Over!', width / 2, height / 2 - 30);
    text('Final Score: ' + score, width / 2, height / 2 + 10);
    
    textSize(16);
    fill(180);
    text('Click to Play Again', width / 2, height / 2 + 50);
    return;
  }

  // 3. GAMEPLAY LOGIC
  let elapsed = (millis() - startTime) / 1000;
  let timeLeft = max(0, duration - elapsed);

  if (timeLeft <= 0) {
    state = 'over';
    return;
  }

  // Teleport target based on speed
  if (frameCount % max(1, floor(spawnEvery)) === 0) {
    spawnTarget();
  }

  // Draw selected Minecraft Icon
  drawMinecraftIcon(target.x, target.y, targetType);

  updateAndDrawParticles();

  // UI (Score & Timer)
  fill(255);
  textSize(16);
  textAlign(LEFT, TOP);
  text('Score: ' + score, 12, 12);

  let minutes = floor(timeLeft / 60);
  let seconds = floor(timeLeft % 60);
  let timeStr = minutes + ':' + (seconds < 10 ? '0' : '') + seconds;

  textAlign(RIGHT, TOP);
  text('Time: ' + timeStr, width - 12, 12);
}

// Pixelated Minecraft icon rendering
function drawMinecraftIcon(x, y, type) {
  push();
  rectMode(CENTER);
  noStroke();

  if (type === 'ghost') {
    // Minecraft Ghast
    fill(235);
    rect(x, y, 50, 50, 4);
    fill(40);
    rect(x - 10, y - 5, 8, 12); // Red/dark eyes
    rect(x + 10, y - 5, 8, 12);
    rect(x, y + 10, 12, 10); // Open mouth
  } 
  else if (type === 'pumpkin') {
    // Minecraft Jack-o'-lantern
    fill(225, 110, 15);
    rect(x, y, 50, 50, 4);
    fill(255, 200, 30); // Glowing carved face
    triangle(x - 12, y - 10, x - 18, y, x - 6, y);
    triangle(x + 12, y - 10, x + 6, y, x + 18, y);
    rect(x, y + 10, 24, 8);
  } 
  else if (type === 'witch') {
    // Minecraft Witch Head
    fill(200, 180, 150);
    rect(x, y, 44, 44, 4);
    // Green wart nose
    fill(100, 160, 60);
    rect(x, y + 6, 8, 14);
    // Witch Hat
    fill(40, 35, 50);
    rect(x, y - 24, 60, 8);
    rect(x, y - 36, 32, 20);
    fill(140, 40, 160); // Purple hat band
    rect(x, y - 28, 34, 6);
  } 
  else if (type === 'monster') {
    // Minecraft Creeper
    fill(40, 180, 50);
    rect(x, y, 50, 50, 4);
    fill(0);
    rect(x - 10, y - 8, 10, 10);
    rect(x + 10, y - 8, 10, 10);
    rect(x, y + 4, 8, 14);
    rect(x - 6, y + 10, 6, 12);
    rect(x + 6, y + 10, 6, 12);
  } 
  else if (type === 'zombie') {
    // Minecraft Zombie
    fill(60, 130, 80);
    rect(x, y, 50, 50, 4);
    fill(20, 40, 25);
    rect(x - 10, y - 6, 10, 8);
    rect(x + 10, y - 6, 10, 8);
    rect(x, y + 8, 16, 6);
  }

  pop();
}

function updateAndDrawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= 8;
    p.size *= 0.95;

    noStroke();
    fill(p.color[0], p.color[1], p.color[2], p.alpha);
    rect(p.x, p.y, p.size, p.size);

    if (p.alpha <= 0 || p.size <= 0.5) {
      particles.splice(i, 1);
    }
  }
}

function drawMinecraftClouds() {
  fill(220, 220, 220, 200);
  noStroke();

  for (let cloud of clouds) {
    cloud.x += cloud.speed;
    if (cloud.x > width + 60) cloud.x = -80;

    rect(cloud.x, cloud.y, 60, 16);
    rect(cloud.x + 12, cloud.y - 10, 40, 10);
    rect(cloud.x + 20, cloud.y + 16, 30, 8);
  }
}

function speedUp() {
  score++;
  if (spawnEvery > minSpawnEvery) {
    spawnEvery -= 2.5; // Speeds up teleporting speed
  }
}

function mousePressed() {
  initAudio(); // Initialize audio context on first click

  if (state === 'start' || state === 'over') {
    state = 'play';
    score = 0;
    spawnEvery = 60;
    startTime = millis();
    spawnTarget();
  } else if (state === 'play') {
    if (dist(mouseX, mouseY, target.x, target.y) < 30) {
      playClickSound(); // Play 8-bit sound effect
      speedUp();
      createTeleportParticles(target.x, target.y);
      changeTargetIcon(); // Randomly change target icon
      spawnTarget();
    }
  }
}
</script>

</body>
</html>
