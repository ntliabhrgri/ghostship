<html>
<head>
  <title>Minecraft Teleport Game</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: sans-serif;
    }
    canvas {
      border: 2px solid #222;
    }
  </style>
</head>
<body>

<script>
// game setup vars
let mobX, mobY;
let currentMob = 'ghost';
let points = 0;
let totalTime = 180;
let gameStart = 0;
let mode = 'start'; 
let waitFrames = 60; 

// arrays for background and FX
const mobList = ['ghost', 'pumpkin', 'witch', 'monster', 'zombie'];
let bgDots = [];
let cloudList = [];
let fxList = [];

// audio context for retro click sound
let myAudio;

function audioSetup() {
  if (!myAudio) {
    myAudio = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playBeep() {
  if (!myAudio) return;
  if (myAudio.state === 'suspended') {
    myAudio.resume();
  }

  let osc = myAudio.createOscillator();
  let vol = myAudio.createGain();

  osc.type = 'square';
  osc.frequency.setValueAtTime(350, myAudio.currentTime);
  osc.frequency.exponentialRampToValueAtTime(750, myAudio.currentTime + 0.08);

  vol.gain.setValueAtTime(0.15, myAudio.currentTime);
  vol.gain.exponentialRampToValueAtTime(0.01, myAudio.currentTime + 0.08);

  osc.connect(vol);
  vol.connect(myAudio.destination);

  osc.start();
  osc.stop(myAudio.currentTime + 0.08);
}

function setup() {
  createCanvas(480, 360);
  relocateMob();

  // add background dots
  for (let i = 0; i < 45; i++) {
    bgDots.push({
      x: random(width),
      y: random(height),
      sz: random(1, 3)
    });
  }

  // add background clouds
  for (let i = 0; i < 4; i++) {
    cloudList.push({
      x: random(width),
      y: random(15, 90),
      spd: random(0.2, 0.4)
    });
  }
}

function relocateMob() {
  mobX = random(40, width - 40);
  mobY = random(40, height - 40);
}

function pickNewMob() {
  let filtered = mobList.filter(m => m !== currentMob);
  currentMob = random(filtered);
}

function addBurst(x, y) {
  for (let i = 0; i < 20; i++) {
    let a = random(TWO_PI);
    let s = random(2, 5);
    fxList.push({
      x: x,
      y: y,
      vx: cos(a) * s,
      vy: sin(a) * s,
      sz: random(4, 7),
      a: 255
    });
  }
}

function draw() {
  background(0);

  // render stars
  fill(255);
  noStroke();
  for (let d of bgDots) {
    ellipse(d.x, d.y, d.sz, d.sz);
  }

  // render clouds
  fill(220, 220, 220, 180);
  for (let c of cloudList) {
    c.x += c.spd;
    if (c.x > width + 50) c.x = -70;
    rect(c.x, c.y, 60, 16);
    rect(c.x + 10, c.y - 8, 40, 10);
  }

  // start menu
  if (mode === 'start') {
    textAlign(CENTER, CENTER);
    fill(255);
    textSize(26);
    text('MINECRAFT TELEPORT', width / 2, height / 2 - 20);
    textSize(18);
    fill(200);
    text('Click Anywhere to Play', width / 2, height / 2 + 25);
    return;
  }

  // game over screen
  if (mode === 'over') {
    textAlign(CENTER, CENTER);
    fill(255);
    textSize(24);
    text('Game Over!', width / 2, height / 2 - 20);
    text('Score: ' + points, width / 2, height / 2 + 15);
    textSize(16);
    fill(180);
    text('Click to Play Again', width / 2, height / 2 + 50);
    return;
  }

  // gameplay loop
  let passed = (millis() - gameStart) / 1000;
  let remaining = max(0, totalTime - passed);

  if (remaining <= 0) {
    mode = 'over';
    return;
  }

  // teleport timer check
  if (frameCount % max(1, floor(waitFrames)) === 0) {
    relocateMob();
  }

  drawMob(mobX, mobY, currentMob);
  drawParticles();

  // render HUD
  fill(255);
  textSize(16);
  textAlign(LEFT, TOP);
  text('Score: ' + points, 12, 12);

  let mins = floor(remaining / 60);
  let secs = floor(remaining % 60);
  let timerText = mins + ':' + (secs < 10 ? '0' : '') + secs;

  textAlign(RIGHT, TOP);
  text('Time: ' + timerText, width - 12, 12);
}

function drawMob(x, y, kind) {
  push();
  rectMode(CENTER);
  noStroke();

  if (kind === 'ghost') {
    fill(235);
    rect(x, y, 48, 48, 4);
    fill(40);
    rect(x - 10, y - 4, 8, 10);
    rect(x + 10, y - 4, 8, 10);
    rect(x, y + 10, 10, 8);
  } else if (kind === 'pumpkin') {
    fill(225, 110, 15);
    rect(x, y, 48, 48, 4);
    fill(255, 200, 30);
    triangle(x - 12, y - 8, x - 18, y, x - 6, y);
    triangle(x + 12, y - 8, x + 6, y, x + 18, y);
    rect(x, y + 10, 22, 6);
  } else if (kind === 'witch') {
    fill(190, 170, 140);
    rect(x, y, 42, 42, 4);
    fill(90, 150, 50);
    rect(x, y + 5, 8, 12);
    fill(35, 30, 45);
    rect(x, y - 22, 56, 8);
    rect(x, y - 34, 30, 18);
  } else if (kind === 'monster') {
    fill(40, 175, 50);
    rect(x, y, 48, 48, 4);
    fill(0);
    rect(x - 10, y - 6, 8, 8);
    rect(x + 10, y - 6, 8, 8);
    rect(x, y + 4, 8, 12);
    rect(x - 5, y + 8, 5, 10);
    rect(x + 5, y + 8, 5, 10);
  } else if (kind === 'zombie') {
    fill(55, 125, 75);
    rect(x, y, 48, 48, 4);
    fill(20, 35, 20);
    rect(x - 10, y - 5, 8, 8);
    rect(x + 10, y - 5, 8, 8);
    rect(x, y + 8, 14, 5);
  }

  pop();
}

function drawParticles() {
  for (let i = fxList.length - 1; i >= 0; i--) {
    let p = fxList[i];
    p.x += p.vx;
    p.y += p.vy;
    p.a -= 10;

    noStroke();
    fill(200, 240, 255, p.a);
    rect(p.x, p.y, p.sz, p.sz);

    if (p.a <= 0) {
      fxList.splice(i, 1);
    }
  }
}

function mousePressed() {
  audioSetup();

  if (mode === 'start' || mode === 'over') {
    mode = 'play';
    points = 0;
    waitFrames = 60;
    gameStart = millis();
    relocateMob();
  } else if (mode === 'play') {
    if (dist(mouseX, mouseY, mobX, mobY) < 28) {
      playBeep();
      points++;
      if (waitFrames > 12) waitFrames -= 2.2;
      addBurst(mobX, mobY);
      pickNewMob();
      relocateMob();
    }
  }
}
</script>

</body>
</html>
