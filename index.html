<html>
<head>
  
  <title>Minecraft Teleport Game</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0f0f11;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', Courier, monospace;
    }

    canvas {
      border: 3px solid #333;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

<script>
  const GAME_DURATION = 180;
  const MOBS = ['ghost', 'pumpkin', 'witch', 'monster', 'zombie'];
  
  let score = 0;
  let timeRemaining = GAME_DURATION;
  let gameState = 'START';
  
  let currentMob = 'ghost';
  let mobPos = { x: 0, y: 0 };
  let mobRadius = 24;
  
  let lastSpawnTime = 0;
  let mobInterval = 1000;
  
  let popSound;
  let particles = [];
  let stars = [];

  function preload() {
    soundFormats('mp3', 'wav');
    popSound = loadSound('assets/pop.mp3');
  }

  function setup() {
    createCanvas(480, 360);
    ellipseMode(CENTER);
    rectMode(CENTER);

    for (let i = 0; i < 40; i++) {
      stars.push({
        x: random(width),
        y: random(height),
        size: random(1, 3)
      });
    }

    spawnMob();
  }

  function draw() {
    background(15, 15, 25);
    drawStarfield();

    switch (gameState) {
      case 'START':
        drawStartScreen();
        break;
      case 'PLAYING':
        updateGame();
        drawGameScreen();
        break;
      case 'GAMEOVER':
        drawGameOverScreen();
        break;
    }
  }

  function updateGame() {
    timeRemaining = GAME_DURATION - floor((millis() - lastSpawnTime) / 1000);

    if (timeRemaining <= 0) {
      gameState = 'GAMEOVER';
      return;
    }

    if (millis() - lastSpawnTime > mobInterval) {
      spawnMob();
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.alpha -= 8;

      if (p.alpha <= 0) {
        particles.splice(i, 1);
      }
    }
  }

  function spawnMob() {
    let options = MOBS.filter(m => m !== currentMob);
    currentMob = random(options);

    mobPos.x = random(40, width - 40);
    mobPos.y = random(40, height - 40);
    
    lastSpawnTime = millis();
  }

  function createBurst(x, y) {
    for (let i = 0; i < 15; i++) {
      let angle = random(TWO_PI);
      let speed = random(1.5, 4);
      particles.push({
        x: x,
        y: y,
        vx: cos(angle) * speed,
        vy: sin(angle) * speed,
        size: random(3, 6),
        alpha: 255
      });
    }
  }

  function drawStarfield() {
    fill(200);
    noStroke();
    for (let s of stars) {
      ellipse(s.x, s.y, s.size);
    }
  }

  function drawMob(x, y, type) {
    push();
    translate(x, y);

    const mobColors = {
      ghost: '#E0E0E0',
      pumpkin: '#FF7518',
      witch: '#7B3F00',
      monster: '#2E8B57',
      zombie: '#4A7C59'
    };

    fill(mobColors[type] || '#FFFFFF');
    rect(0, 0, 44, 44, 6);

    fill(20);
    rect(-10, -6, 8, 8);
    rect(10, -6, 8, 8);
    rect(0, 8, 12, 6);

    pop();
  }

  function drawParticles() {
    noStroke();
    for (let p of particles) {
      fill(180, 220, 255, p.alpha);
      rect(p.x, p.y, p.size, p.size);
    }
  }

  function drawStartScreen() {
    textAlign(CENTER, CENTER);
    fill(255);
    textSize(24);
    text('MINECRAFT TELEPORT', width / 2, height / 2 - 20);
    
    textSize(14);
    fill(170);
    text('Click anywhere to start', width / 2, height / 2 + 25);
  }

  function drawGameScreen() {
    drawMob(mobPos.x, mobPos.y, currentMob);
    drawParticles();

    fill(255);
    textSize(16);
    textAlign(LEFT, TOP);
    text(`Score: ${score}`, 15, 15);

    textAlign(RIGHT, TOP);
    text(`Time: ${max(0, timeRemaining)}s`, width - 15, 15);
  }

  function drawGameOverScreen() {
    textAlign(CENTER, CENTER);
    fill(255);
    textSize(28);
    text('Game Over!', width / 2, height / 2 - 25);
    
    textSize(18);
    fill(200);
    text(`Final Score: ${score}`, width / 2, height / 2 + 10);
    
    textSize(13);
    fill(150);
    text('Click to play again', width / 2, height / 2 + 55);
  }

  function mousePressed() {
    if (gameState === 'START' || gameState === 'GAMEOVER') {
      score = 0;
      timeRemaining = GAME_DURATION;
      mobInterval = 1000;
      gameState = 'PLAYING';
      spawnMob();
      return;
    }

    if (gameState === 'PLAYING') {
      let d = dist(mouseX, mouseY, mobPos.x, mobPos.y);
      if (d < mobRadius) {
        if (popSound && popSound.isLoaded()) {
          popSound.play();
        }
        score++;
        
        if (mobInterval > 300) {
          mobInterval -= 25;
        }

        createBurst(mobPos.x, mobPos.y);
        spawnMob();
      }
    }
  }
</script>

</body>
</html>
</html>
